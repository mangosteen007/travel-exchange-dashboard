<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>여행 환율 대시보드</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 24px 16px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #181818; color: #e8e8e8; }
      .currency-card, .chart-wrap, .ind-card, .stat-item { background: #242424 !important; border-color: rgba(255,255,255,0.1) !important; }
      .stat-item { background: #2e2e2e !important; }
      .period-btn { color: #aaa; border-color: rgba(255,255,255,0.15); }
      .period-btn.active { background: #333; color: #e8e8e8; }
      .cc-name, .cc-unit, .ind-pct, .section-label, .update-time { color: #888 !important; }
      .cc-rate, .ind-name, .stat-val, .chart-title { color: #e8e8e8 !important; }
      .ind-status-green { color: #7dc247 !important; }
      .ind-status-yellow { color: #f0a030 !important; }
      .ind-status-red { color: #e06060 !important; }
      .percentile-bar { background: #333 !important; }
      .percentile-marker { border-color: #242424 !important; }
      .page-title { color: #e8e8e8 !important; }
      .badge-up { background: #3d1f1f !important; color: #e06060 !important; }
      .badge-down { background: #1e2e1a !important; color: #7dc247 !important; }
      .badge-neutral { background: #2e2e2e !important; color: #aaa !important; }
    }
    .container { max-width: 860px; margin: 0 auto; }
    .page-title { font-size: 22px; font-weight: 500; color: #1a1a1a; margin-bottom: 4px; }
    .update-time { font-size: 12px; color: #999; margin-bottom: 24px; }
    .section-label { font-size: 11px; font-weight: 500; color: #999; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
    .currency-grid { display: flex; flex-wrap: nowrap; gap: 10px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; }
    .currency-grid::-webkit-scrollbar { height: 4px; }
    .currency-grid::-webkit-scrollbar-track { background: transparent; }
    .currency-grid::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }
    .currency-card { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: border-color 0.15s; flex: 0 0 148px; }
    .currency-card:hover { border-color: rgba(0,0,0,0.25); }
    .currency-card.active { border: 1.5px solid #378ADD; }
    .flag { font-size: 20px; margin-bottom: 8px; display: block; }
    .cc-name { font-size: 11px; color: #999; margin-bottom: 2px; }
    .cc-rate { font-size: 22px; font-weight: 500; color: #1a1a1a; margin-bottom: 4px; }
    .cc-unit { font-size: 11px; color: #aaa; margin-bottom: 8px; }
    .badge-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; font-weight: 500; }
    .badge-up { background: #FCEBEB; color: #A32D2D; }
    .badge-down { background: #EAF3DE; color: #3B6D11; }
    .timing-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .dot-green { background: #639922; }
    .dot-yellow { background: #BA7517; }
    .dot-red { background: #A32D2D; }
    .timing-label { font-size: 11px; color: #888; }
    .chart-wrap { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 18px; margin-bottom: 24px; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
    .chart-title { font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .period-tabs { display: flex; gap: 4px; }
    .period-btn { font-size: 12px; padding: 3px 10px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.15); background: transparent; color: #666; cursor: pointer; font-family: inherit; }
    .period-btn.active { background: #f0f0ec; color: #1a1a1a; border-color: rgba(0,0,0,0.2); }
    .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
    .stat-item { background: #f5f5f0; border-radius: 8px; padding: 10px 12px; }
    .stat-label { font-size: 11px; color: #999; margin-bottom: 3px; }
    .stat-val { font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .indicator-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; padding-bottom: 16px; }
    .ind-card { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 10px; }
    .ind-flag { font-size: 18px; margin-top: 2px; }
    .ind-name { font-size: 13px; font-weight: 500; color: #1a1a1a; margin-bottom: 2px; }
    .ind-status { font-size: 12px; margin-bottom: 4px; font-weight: 500; }
    .ind-status-green { color: #3B6D11; }
    .ind-status-yellow { color: #854F0B; }
    .ind-status-red { color: #A32D2D; }
    .ind-pct { font-size: 11px; color: #999; }
    .percentile-bar { height: 4px; border-radius: 2px; background: #eee; margin-top: 8px; position: relative; }
    .percentile-segment { height: 4px; border-radius: 2px; position: absolute; top: 0; }
    .percentile-marker { width: 8px; height: 8px; border-radius: 50%; background: #1a1a1a; position: absolute; top: -2px; transform: translateX(-50%); border: 1.5px solid #fff; }
    .scroll-wrapper { position: relative; margin-bottom: 24px; }
  .scroll-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; background: var(--bg, #fff); border: 0.5px solid rgba(0,0,0,0.15); box-shadow: 0 2px 8px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 14px; color: #444; transition: opacity 0.2s; user-select: none; }
  .scroll-arrow:hover { background: #f5f5f0; }
  .scroll-arrow.hidden { opacity: 0; pointer-events: none; }
  .scroll-arrow-left { left: -14px; }
  .scroll-arrow-right { right: -14px; }
  @media (prefers-color-scheme: dark) { .scroll-arrow { background: #2e2e2e; border-color: rgba(255,255,255,0.15); color: #ccc; } .scroll-arrow:hover { background: #3a3a3a; } }
    .error-msg { font-size: 13px; color: #999; text-align: center; padding: 20px; grid-column: 1 / -1; }
  </style>
</head>
<body>
<div class="container">
  <div class="page-title">여행 환율 대시보드</div>
  <div class="update-time" id="update-time">환율 불러오는 중...</div>

  <div class="section-label">주요 여행지 환율</div>
  <div class="scroll-wrapper">
    <button class="scroll-arrow scroll-arrow-left hidden" id="arrow-left" onclick="scrollCards(-1)">&#8249;</button>
    <div class="currency-grid" id="currency-grid">
      <div class="loading-msg">환율 데이터 불러오는 중...</div>
    </div>
    <button class="scroll-arrow scroll-arrow-right" id="arrow-right" onclick="scrollCards(1)">&#8250;</button>
  </div>

  <div class="chart-wrap">
    <div class="chart-header">
      <div class="chart-title" id="chart-title">환율 추이</div>
      <div class="period-tabs">
        <button class="period-btn" onclick="changePeriod(30, this)">1개월</button>
        <button class="period-btn" onclick="changePeriod(90, this)">3개월</button>
        <button class="period-btn" onclick="changePeriod(180, this)">6개월</button>
        <button class="period-btn active" onclick="changePeriod(365, this)">1년</button>
      </div>
    </div>
    <div style="position: relative; height: 220px;">
      <canvas id="rateChart" role="img" aria-label="선택된 통화의 환율 추이 그래프"></canvas>
    </div>
    <div class="stat-row" id="stat-row"></div>
  </div>

</div>

<script>
// per: 표시 단위 (예: JPY는 100엔 기준으로 표시)
// historicalData, ratesData 는 모두 "표시 단위(per) 기준 KRW 값"으로 저장
const CURRENCIES = [
  { code: 'TWD', name: '대만 달러',        flag: '🇹🇼', dest: '대만',      unit: '1 TWD',    color: '#0F6E56', per: 1    },
  { code: 'USD', name: '미국 달러',        flag: '🇺🇸', dest: '미국',      unit: '1 USD',    color: '#378ADD', per: 1    },

  { code: 'EUR', name: '유럽 유로',        flag: '🇪🇺', dest: '유럽',      unit: '1 EUR',    color: '#3B6D11', per: 1    },
  { code: 'IDR', name: '인도네시아 루피아', flag: '🇮🇩', dest: '인도네시아', unit: '1000 IDR', color: '#D85A30', per: 1000 },
  { code: 'JPY', name: '일본 엔',          flag: '🇯🇵', dest: '일본',      unit: '100 JPY',  color: '#E24B4A', per: 100  },
  { code: 'CNY', name: '중국 위안',        flag: '🇨🇳', dest: '중국',      unit: '1 CNY',    color: '#993556', per: 1    },
  { code: 'THB', name: '태국 바트',        flag: '🇹🇭', dest: '태국',      unit: '1 THB',    color: '#BA7517', per: 1    },
  { code: 'HKD', name: '홍콩 달러',        flag: '🇭🇰', dest: '홍콩',      unit: '1 HKD',    color: '#7F77DD', per: 1    },
];

let ratesData = {};      // code → KRW per 표시단위 (예: JPY → 100엔당 원화)
let historicalData = {}; // code → [{t, v}] (v = KRW per 표시단위)
let selectedCode = 'JPY';
let chartInstance = null;
let currentPeriod = 365;

function dateStr(d) {
  return d.toISOString().slice(0, 10);
}

// EUR 기준 rates에서 KRW-per-표시단위 계산
// rates[date] = { USD: 1.08, JPY: 160, KRW: 1500, ... } (EUR 기준)
function eurRatesToKrw(ratesObj, dates) {
  const history = {};
  const latest = {};
  CURRENCIES.forEach(c => { history[c.code] = []; });

  dates.forEach(dt => {
    const r = ratesObj[dt];
    if (!r || !r['KRW']) return;
    const eurToKrw = r['KRW']; // 1 EUR = N KRW
    CURRENCIES.forEach(c => {
      if (c.code === 'VND') return; // 별도 처리
      const eurToX = c.code === 'EUR' ? 1 : r[c.code];
      if (!eurToX) return;
      // 1 KRW = (1/eurToKrw) EUR = (1/eurToKrw * eurToX) 외화
      // 1 외화 = eurToKrw / eurToX KRW
      const krwPerOne = eurToKrw / eurToX;
      history[c.code].push({ t: new Date(dt), v: krwPerOne * c.per });
    });
  });

  // latest = 마지막 날짜
  const lastDt = dates[dates.length - 1];
  const r = ratesObj[lastDt];
  if (r && r['KRW']) {
    CURRENCIES.forEach(c => {
      if (c.code === 'VND') return;
      const eurToX = c.code === 'EUR' ? 1 : r[c.code];
      if (!eurToX) return;
      latest[c.code] = (r['KRW'] / eurToX) * c.per;
    });
  }
  return { history, latest };
}

async function fetchAllData() {
  const end = new Date();
  const start = new Date();
  start.setFullYear(start.getFullYear() - 1);

  const fxCodes = CURRENCIES.filter(c => c.code !== 'VND').map(c => c.code).join(',') + ',KRW';

  // 1차: Frankfurter (EUR 기준, 일별 히스토리)
  let history = {};
  let latest = {};
  let source = '';

  try {
    const [histRes, latestRes] = await Promise.all([
      fetch(`https://api.frankfurter.dev/${dateStr(start)}..${dateStr(end)}?to=${fxCodes}`, { signal: AbortSignal.timeout(10000) }),
      fetch(`https://api.frankfurter.dev/v1/latest?to=${fxCodes}`, { signal: AbortSignal.timeout(10000) })
    ]);
    if (!histRes.ok || !latestRes.ok) throw new Error('frankfurter fail');
    const histJson = await histRes.json();
    const latestJson = await latestRes.json();

    const allRates = { ...histJson.rates };
    allRates[latestJson.date] = latestJson.rates;
    const dates = Object.keys(allRates).sort();
    const result = eurRatesToKrw(allRates, dates);
    history = result.history;
    latest = result.latest;
    source = 'Frankfurter';
  } catch {
    // 2차: fawazahmed0 - latest만 사용, 히스토리는 없음
    try {
      const latestRes = await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/krw.json`, { signal: AbortSignal.timeout(10000) });
      if (!latestRes.ok) throw new Error();
      const latestJson = await latestRes.json();
      CURRENCIES.forEach(c => { history[c.code] = []; });
      CURRENCIES.forEach(c => {
        const raw = latestJson.krw?.[c.code.toLowerCase()];
        if (raw) latest[c.code] = (1 / raw) * c.per;
      });
      source = 'fawazahmed0 (히스토리 없음 — 여행 적기 판단 불가)';
    } catch { return null; }
  }

  return { history, latest, source };
}

function scrollCards(dir) {
  const grid = document.getElementById('currency-grid');
  grid.scrollBy({ left: dir * 170, behavior: 'smooth' });
}

function updateArrows() {
  const grid = document.getElementById('currency-grid');
  const left = document.getElementById('arrow-left');
  const right = document.getElementById('arrow-right');
  if (!left || !right) return;
  left.classList.toggle('hidden', grid.scrollLeft <= 4);
  right.classList.toggle('hidden', grid.scrollLeft + grid.clientWidth >= grid.scrollWidth - 4);
}

function getPercentile(current, history) {
  const vals = history.map(d => d.v);
  return Math.round((vals.filter(v => v <= current).length / vals.length) * 100);
}

function timingStatus(pct) {
  if (pct <= 33) return { label: '지금 가기 좋아요', cls: 'ind-status-green', dotCls: 'dot-green' };
  if (pct <= 66) return { label: '평균 수준이에요',   cls: 'ind-status-yellow', dotCls: 'dot-yellow' };
  return            { label: '조금 기다려보세요',    cls: 'ind-status-red',    dotCls: 'dot-red' };
}

function changePct(history, days) {
  if (history.length < 2) return 0;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const filtered = history.filter(d => new Date(d.t) >= cutoff);
  if (filtered.length < 2) {
    // 데이터가 부족하면 전체 히스토리 첫/끝 비교
    const first = history[0].v;
    const last = history[history.length - 1].v;
    return ((last - first) / first) * 100;
  }
  return ((filtered[filtered.length - 1].v - filtered[0].v) / filtered[0].v) * 100;
}

function renderCards() {
  const grid = document.getElementById('currency-grid');
  grid.innerHTML = '';
  CURRENCIES.forEach(c => {
    const history = historicalData[c.code] || [];
    const current = ratesData[c.code];
    if (!current) return;
    const pct1m = changePct(history, 30);
    const pctile = getPercentile(current, history);
    const timing = timingStatus(pctile);
    const hasHistory = history.length >= 10;
    const card = document.createElement('div');
    card.className = 'currency-card' + (c.code === selectedCode ? ' active' : '');
    card.onclick = () => selectCurrency(c.code);
    card.innerHTML = `
      <span class="flag">${c.flag}</span>
      <div class="cc-name">${c.name}</div>
      <div class="cc-rate">${current.toLocaleString('ko-KR', { maximumFractionDigits: 1 })}원</div>
      <div class="cc-unit">${c.unit} 기준</div>
      <div class="badge-row">
        <span class="badge ${pct1m >= 0 ? 'badge-up' : 'badge-down'}">${pct1m >= 0 ? '▲' : '▼'} ${Math.abs(pct1m).toFixed(1)}%</span>
        ${hasHistory ? `<span style="display:flex;align-items:center;gap:4px;"><span class="timing-dot ${timing.dotCls}"></span><span class="timing-label">${timing.label}</span></span>` : ''}
      </div>`;
    grid.appendChild(card);
  });
}

function selectCurrency(code) {
  selectedCode = code;
  document.querySelectorAll('.currency-card').forEach((el, i) => {
    el.classList.toggle('active', CURRENCIES[i].code === code);
  });
  renderChart();
}

function changePeriod(days, btn) {
  currentPeriod = days;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChart();
}

function renderChart() {
  const c = CURRENCIES.find(x => x.code === selectedCode);
  if (!c) return;
  const fullHistory = historicalData[c.code] || [];

  // 날짜 기준 필터링
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - currentPeriod);
  const history = fullHistory.filter(d => new Date(d.t) >= cutoff);
  const displayHistory = history.length >= 2 ? history : fullHistory.slice(-2);

  document.getElementById('chart-title').textContent = `${c.flag} ${c.name} 환율 추이`;
  const labels = displayHistory.map(d => { const dt = new Date(d.t); return `${dt.getMonth()+1}/${dt.getDate()}`; });
  const values = displayHistory.map(d => d.v);
  const min1y = fullHistory.length ? Math.min(...fullHistory.map(d => d.v)) : 0;
  const max1y = fullHistory.length ? Math.max(...fullHistory.map(d => d.v)) : 0;
  const current = values[values.length - 1];
  const pctChange = values.length > 1 ? ((current - values[0]) / values[0]) * 100 : 0;
  document.getElementById('stat-row').innerHTML = `
    <div class="stat-item"><div class="stat-label">현재</div><div class="stat-val">${current.toLocaleString('ko-KR',{maximumFractionDigits:1})}원</div></div>
    <div class="stat-item"><div class="stat-label">1년 최저</div><div class="stat-val" style="color:#3B6D11">${min1y.toLocaleString('ko-KR',{maximumFractionDigits:1})}원</div></div>
    <div class="stat-item"><div class="stat-label">1년 최고</div><div class="stat-val" style="color:#A32D2D">${max1y.toLocaleString('ko-KR',{maximumFractionDigits:1})}원</div></div>`;
  if (chartInstance) chartInstance.destroy();
  const ctx = document.getElementById('rateChart').getContext('2d');
  const isUp = pctChange >= 0;
  const lineColor = isUp ? '#E24B4A' : '#3B6D11';
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: lineColor,
        borderWidth: 1.5,
        pointRadius: 0,
        pointHoverRadius: 4,
        tension: 0.3,
        fill: true,
        backgroundColor: (ctx2) => {
          const g = ctx2.chart.ctx.createLinearGradient(0, 0, 0, 200);
          g.addColorStop(0, isUp ? 'rgba(226,75,74,0.1)' : 'rgba(59,109,17,0.1)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          return g;
        }
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (i) => `${i.parsed.y.toLocaleString('ko-KR',{maximumFractionDigits:1})}원` } }
      },
      scales: {
        x: { ticks: { maxTicksLimit: 8, font: { size: 11 }, color: '#888' }, grid: { display: false }, border: { display: false } },
        y: { ticks: { font: { size: 11 }, color: '#888', callback: v => v.toLocaleString('ko-KR',{maximumFractionDigits:0}) }, grid: { color: 'rgba(128,128,128,0.07)' }, border: { display: false } }
      }
    }
  });
}

async function init() {
  document.getElementById('update-time').textContent = '환율 데이터 불러오는 중... (최대 10초 소요)';
  const data = await fetchAllData();
  if (!data) {
    document.getElementById('currency-grid').innerHTML = '<div class="error-msg">환율 데이터를 불러오지 못했어요.<br>GitHub Pages에 올린 후 정상 동작합니다.</div>';
    document.getElementById('update-time').textContent = 'claude.ai 미리보기 환경에서는 외부 API 호출이 제한됩니다.';
    return;
  }
  const now = new Date();
  document.getElementById('update-time').textContent =
    `${now.toLocaleDateString('ko-KR')} ${now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 기준 · 실제 환율 데이터 (${data.source})`;
  CURRENCIES.forEach(c => {
    ratesData[c.code] = data.latest[c.code];
    historicalData[c.code] = data.history[c.code] || [];
  });
  renderCards();
  document.getElementById('currency-grid').addEventListener('scroll', updateArrows);
  setTimeout(updateArrows, 100);
  renderChart();
}

init();
</script>
</body>
</html>
